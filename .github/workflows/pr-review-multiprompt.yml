name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-prompt
    permissions:
      pull-requests: write  # needed to post review comments
      id-token: write       # needed for OIDC → AWS role assumption
      contents: read        # needed for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: multi-prompt/package-lock.json

      - name: Configure AWS credentials (Bedrock)
        if: ${{ contains(vars.MODEL_DEPLOYMENT_NAME, 'claude') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install dependencies
        run: npm ci

      - name: Run PR review
        run: npm run review-pr
        env:
          AZURE_API_ENDPOINT: ${{ secrets.AZURE_API_ENDPOINT }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          MODEL_DEPLOYMENT_NAME: ${{ vars.MODEL_DEPLOYMENT_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish cost summary and comparison artifact
        if: always()
        working-directory: multi-prompt
        run: |
          python3 << 'EOF'
          import json, os
          pricing = {
              'gpt-5.4':                   {'input_cost_per_token': 2.50  / 1_000_000, 'output_cost_per_token': 15.00 / 1_000_000},
              'Kimi-K2.6':                 {'input_cost_per_token': 0.8   / 1_000_000, 'output_cost_per_token':  2.00 / 1_000_000},
              'DeepSeek-V4-Pro':           {'input_cost_per_token': 0.435 / 1_000_000, 'output_cost_per_token':  0.87 / 1_000_000},
              'anthropic.claude-sonnet-4-6': {'input_cost_per_token': 3.00 / 1_000_000, 'output_cost_per_token': 15.00 / 1_000_000},
          }
          d = json.load(open('token-usage.json', encoding='utf-8'))
          deployment = d.get('model', 'unknown')
          mp = pricing.get(deployment, {})
          if not mp:
              print(f'WARNING: model "{deployment}" not found in pricing table — cost will be N/A')
          ip = mp.get('input_cost_per_token', 0) * 1_000_000
          op = mp.get('output_cost_per_token', 0) * 1_000_000
          tu = d['token_usage']
          def calc_cost(prompt, completion):
              if not ip and not op:
                  return None
              return round((prompt * ip + completion * op) / 1_000_000, 6)
          total_cost = calc_cost(tu['prompt_tokens'], tu['completion_tokens'])
          step_usage = d.get('token_usage_by_step', [])
          for s in step_usage:
              s['cost_usd'] = calc_cost(s['prompt_tokens'], s['completion_tokens'])
          summary = {
              'workflow': 'multiprompt',
              'model': deployment,
              'input_tokens': tu['prompt_tokens'],
              'output_tokens': tu['completion_tokens'],
              'cost_usd': total_cost,
              'runtime_s': d.get('runtime_s'),
              'findings': d.get('findings'),
              'steps_invoked': d.get('steps_invoked', []),
              'token_usage_by_step': step_usage,
          }
          with open('comparison-summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          cost_str = '${:.4f}'.format(total_cost) if total_cost is not None else 'N/A'
          runtime = d.get('runtime_s')
          runtime_str = '{:.1f}s'.format(runtime) if runtime is not None else 'N/A'
          lines = [
              '## Token Usage & Cost',
              '**Model:** `{}`'.format(deployment),
              '**Runtime:** {}'.format(runtime_str),
              '**Total Cost:** {}'.format(cost_str),
              '',
              '| Step | Input Tokens | Output Tokens | Cost USD |',
              '|------|--------------|---------------|----------|',
          ]
          for s in step_usage:
              sc = s['cost_usd']
              sc_str = '${:.4f}'.format(sc) if sc is not None else 'N/A'
              lines.append('| {} | {:,} | {:,} | {} |'.format(
                  s['step'], s['prompt_tokens'], s['completion_tokens'], sc_str))
          lines.append('| **total** | **{:,}** | **{:,}** | **{}** |'.format(
              tu['prompt_tokens'], tu['completion_tokens'], cost_str))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          EOF

      - name: Upload comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-comparison-multiprompt
          path: multi-prompt/comparison-summary.json
          if-no-files-found: ignore

